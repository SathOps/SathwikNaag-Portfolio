# Visits the Streamlit project app every 6 hours so it never falls asleep.
name: Keep project apps awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1 yaml
      - run: npx playwright install --with-deps chromium
      - run: node scripts/keep-awake.mjs
