question: Tell me about yourself
world: design
answer: 'I''m Sathwik, a designer and engineer at GITAM Hyderabad. I''ve made 400+ creatives: posters, identities, ID cards, merch, wedding suites and UI/UX. I''m the Campus Student Leader for Operations, Design & Media at GITAM Sports, led design for GDGoC, COGAAN and ENIGMA, and I''ve been freelancing for 3+ years.'
