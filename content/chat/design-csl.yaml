question: What is CSL?
world: design
answer: CSL stands for Campus Student Leader. I'm the CSL for Operations, Design & Media at GITAM Sports, GITAM Hyderabad, the biggest design role a student can hold in college. I own the visual identity of GITAM Sports, from trials and the Varsity League to the official 2026–27 kit, and every design that goes out under the GITAM Sports name is reviewed and signed off by me.
