question: Which tools do you design with?
world: design
answer: Figma and FigJam for UI/UX and layouts (Auto Layout, components, variants, prototypes), Adobe Photoshop and Illustrator for posters, identities and print, After Effects for motion, and Canva when a team needs to edit things themselves. I also cut video invites and promo edits.
