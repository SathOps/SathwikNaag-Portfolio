question: What's CSL, and why does it matter for tech?
world: tech
answer: 'CSL is Campus Student Leader. I lead Operations, Design & Media for GITAM Sports at GITAM Hyderabad, the biggest design role a student can hold there. It matters for tech because it''s the same muscle as shipping software: owning outcomes, coordinating people, writing processes and delivering on fixed deadlines. It shows leadership, communication and accountability, not just code.'
