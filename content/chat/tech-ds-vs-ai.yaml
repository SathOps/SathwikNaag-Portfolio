question: Why study Data Science but focus on AI?
world: tech
answer: 'Because I love AI. Data Science gave me the foundation, and AI is where I want to build on it. What keeps me hooked is how fast it moves: there''s always a new model, a new idea or a better way to solve something. It never stands still, and that gives me room to keep learning and growing alongside it. Every time AI evolves, I get to evolve with it.'
