summary: 'Ingests case records, retrieves evidence with hybrid search and routes each question to the right specialist workflow: timeline, witness contradictions, case facts or evidence assessment. Answers come back as validated, cited, structured findings with explicit limitations. It is built to support investigators, not to give legal advice.'
highlights:
- Coordinator-led, intent-routed multi-agent architecture
- 'Hybrid retrieval: 55% semantic + 45% lexical/entity scoring, multi-query expansion, diversity caps'
- Deterministic timeline and contradiction pipelines with provenance-verified quotes
- One LLM service across Ollama, Gemini and OpenAI with fallback and offline mode
- Pydantic response contracts, pytest suite and GitHub Actions CI
