summary: A reproducible baseline hybrid intrusion-detection system on CICIoT2023, used as the starting point for an enhanced architecture. It includes streaming preprocessing, BPSO feature selection, CNN-Transformer + XGBoost + MLP models and validation-driven probability fusion.
highlights:
- Streaming ingestion, cleaning, log1p transform and normalisation for large traffic data
- Binary PSO cut features from 46 to 27 (−41.3%)
- Probability fusion of CNN-Transformer, XGBoost and MLP
- Ablations and an enhanced architecture in progress
