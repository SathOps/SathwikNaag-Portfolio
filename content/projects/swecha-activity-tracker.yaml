summary: Redesigned Swecha's production Activity Tracker, the dashboard interns and mentors use every day for stand-ups and progress tracking. I reworked navigation and information architecture, simplified verification workflows and analytics, and rebuilt the UI as reusable, glassmorphism-inspired components with dual themes and multilingual support.
highlights:
- Reworked navigation and information architecture to cut friction in daily stand-up logging
- Simplified verification workflows and analytics views for mentors
- Glassmorphism-inspired dual-theme design system with reusable, scalable components
- Multilingual accessibility with i18next and responsive layouts for mobile
- Iterated through design evaluations with developers and stakeholders
